<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Locked</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1f3a5f;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
.b{width:min(340px,90vw);text-align:center}h1{font-size:19px;font-weight:600;margin:0 0 14px}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:0;font-size:17px;margin-bottom:10px}
button{width:100%;padding:12px;border-radius:8px;border:0;background:#e0a800;color:#1d2430;font-weight:700;font-size:16px;cursor:pointer}
label{display:block;font-size:13px;opacity:.85;margin:10px 0}#err{color:#ffb4a8;min-height:20px;margin-top:8px;font-size:14px}</style></head>
<body><form class="b" id="f"><h1>🔒 Practice dashboard</h1><input id="p" type="password" autocomplete="current-password" autofocus>
<button type="submit" id="go">Unlock</button><label><input type="checkbox" id="rem" style="width:auto;margin:0 6px 0 0">Remember on this device</label><div id="err"></div></form>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pin){const r=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});const d=await r.json();
const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(d.salt),iterations:d.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(d.iv)},k,b64(d.ct)));}
async function tryPin(p,save){document.getElementById('err').textContent='Unlocking…';try{const h=await decrypt(p);
if(save)localStorage.setItem('mdpass',p);sessionStorage.setItem('mdpass',p);document.open();document.write(h);document.close();}
catch(e){localStorage.removeItem('mdpass');sessionStorage.removeItem('mdpass');document.getElementById('err').textContent='Wrong passcode';}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();tryPin(document.getElementById('p').value,document.getElementById('rem').checked)};
const s=localStorage.getItem('mdpass')||sessionStorage.getItem('mdpass');if(s)tryPin(s,false);
</script></body></html>
